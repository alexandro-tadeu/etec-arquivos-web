name: ETEC Web — testes
on:
  push:
    branches: [main, v3-desenvolvimento]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Executar testes
        run: npm test
      - name: Verificar sintaxe dos módulos
        run: |
          node --check server.js
          node --check v3/api.js
          node --check v3/submission-store.js
          node --check public/atividades.js
