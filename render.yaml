services:
  - type: web
    name: etec-pastas-web
    runtime: node
    plan: free
    buildCommand: echo "Projeto sem dependencias: pronto"
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: admin
