services:
  - type: web
    name: etec-arquivos-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: DATABASE_URL
        sync: false
      - key: ETEC_V3_API_ENABLED
        value: "false"
      - key: V3_STUDENT_CODE_HMAC_KEY
        sync: false
